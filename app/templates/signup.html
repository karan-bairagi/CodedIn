<!DOCTYPE html>
<html lang="en">
<head>
       <script>
(function () {
    function startDarkMode() {
        if (document.documentElement.dataset.codeinDark) {
            return;
        }
        document.documentElement.dataset.codeinDark = "true";
        const COLORS = {
            page: "#0b0f19",
            surface: "#151b2b",
            surface2: "#111827",
            border: "#293449",
            text: "#f8fafc",
            secondary: "#cbd5e1",
            muted: "#94a3b8",
            input: "#101827"
        };
        function ignore(element) {
            const tag = element.tagName.toLowerCase();
            return [
                "img",
                "video",
                "canvas",
                "iframe",
                "svg",
                "path",
                "picture",
                "source"
            ].includes(tag);
        }
        function rgb(color) {
            if (!color) return null;
            const match = color.match(
                /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/
            );
            if (!match) return null;
            return {
                r: Number(match[1]),
                g: Number(match[2]),
                b: Number(match[3])
            };
        }
        function brightness(color) {
            const value = rgb(color);
            if (!value) return null;
            return (
                value.r * 299 +
                value.g * 587 +
                value.b * 114
            ) / 1000;
        }
        function isLightBackground(color) {
            const value = brightness(color);
            if (value === null) {
                return false;
            }
            return value >= 220;

        }
        function isDarkText(color) {
            const value = brightness(color);
            if (value === null) {
                return false;
            }
            return value <= 70;
        }
        function isColored(color) {
            const value = rgb(color);
            if (!value) return false;
            const max = Math.max(
                value.r,
                value.g,
                value.b
            );
            const min = Math.min(
                value.r,
                value.g,
                value.b
            );
            return (max - min) > 35;
        }
        document.documentElement.style.setProperty(
            "background-color",
            COLORS.page,
            "important"
        );
        document.body.style.setProperty(
            "background-color",
            COLORS.page,
            "important"
        );
        document.body.style.setProperty(
            "color",
            COLORS.text,
            "important"
        );
        const elements =
            document.body.querySelectorAll("*");
        elements.forEach(function (element) {
            if (ignore(element)) {
                return;
            }
            const style =
                window.getComputedStyle(element);
            const background =
                style.backgroundColor;
            if (isLightBackground(background)) {
                if (!isColored(background)) {

                    element.style.setProperty(
                        "background-color",
                        COLORS.surface,
                        "important"
                    );
                }
            }
            const textColor =
                style.color;
            if (
                isDarkText(textColor) &&
                !isColored(textColor)
            ) {
                element.style.setProperty(
                    "color",
                    COLORS.text,
                    "important"
                );
            }
            const borderColor =
                style.borderColor;
            if (isLightBackground(borderColor)) {
                element.style.setProperty(
                    "border-color",
                    COLORS.border,
                    "important"
                );
            }
            const tag =
                element.tagName.toLowerCase();
            if (
                tag === "input" ||
                tag === "textarea" ||
                tag === "select"
            ) {
                element.style.setProperty(
                    "background-color",
                    COLORS.input,
                    "important"
                );
                element.style.setProperty(
                    "color",
                    COLORS.text,
                    "important"
                );
                element.style.setProperty(
                    "border-color",
                    COLORS.border,
                    "important"
                );
            }
        });
        document.querySelectorAll(
            "h1,h2,h3,h4,h5,h6"
        ).forEach(function (element) {
            if (ignore(element)) return;
            const color =
                window.getComputedStyle(element).color;
            if (isDarkText(color)) {

                element.style.setProperty(
                    "color",
                    COLORS.text,
                    "important"
                );
            }
        });
        document.querySelectorAll(
            "p,label,li,strong,b"
        ).forEach(function (element) {
            if (ignore(element)) return;
            const color =
                window.getComputedStyle(element).color;
            if (isDarkText(color)) {
                element.style.setProperty(
                    "color",
                    COLORS.secondary,
                    "important"
                );
            }
        });
        const placeholderStyle =
            document.createElement("style");
        placeholderStyle.id =
            "codein-smart-dark-placeholder";
        placeholderStyle.innerHTML = `
            input::placeholder,
            textarea::placeholder {
                color: #64748b !important;
                opacity: 1 !important;
            }
        `;
        document.head.appendChild(
            placeholderStyle
        );
        const scrollbarStyle =
            document.createElement("style");
        scrollbarStyle.id =
            "codein-smart-dark-scrollbar";
        scrollbarStyle.innerHTML = `
            html::-webkit-scrollbar,
            body::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            html::-webkit-scrollbar-track,
            body::-webkit-scrollbar-track {
                background: #0b0f19;
            }

            html::-webkit-scrollbar-thumb,
            body::-webkit-scrollbar-thumb {
                background: #334155;
                border-radius: 10px;
            }
        `;
        document.head.appendChild(
            scrollbarStyle
        );
        const observer =
            new MutationObserver(function (mutations) {

                let newContent = false;
                mutations.forEach(function (mutation) {
                    if (
                        mutation.addedNodes &&
                        mutation.addedNodes.length > 0
                    ) {
                        newContent = true;
                    }
                });
                if (newContent) {

                    setTimeout(
                        startDynamicScan,
                        50
                    );

                }
            });
        observer.observe(
            document.body,
            {
                childList: true,
                subtree: true
            }
        );
        function startDynamicScan() {
            document.body
                .querySelectorAll("*")
                .forEach(function (element) {
                    if (ignore(element)) {
                        return;
                    }
                    const style =
                        window.getComputedStyle(element);
                    const background =
                        style.backgroundColor;
                    if (
                        isLightBackground(background) &&
                        !isColored(background)
                    ) {
                        element.style.setProperty(
                            "background-color",
                            COLORS.surface,
                            "important"
                        );
                    }
                    const color =
                        style.color;
                    if (
                        isDarkText(color) &&
                        !isColored(color)
                    ) {

                        element.style.setProperty(
                            "color",
                            COLORS.text,
                            "important"
                        );
                    }
                });
        }
    }
    if (
        document.readyState === "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            startDarkMode
        );
    } else {
        startDarkMode();
    }
})();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeIn</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/C_Programming_Language.svg/960px-C_Programming_Language.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail&_=20201031132917">
    <style>
        :root {
            --primary: #0a66c2;
            --primary-hover: #004182;
            --bg-surface: #ffffff;
            --bg-global: #f4f7fb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --border-color: #e8edf3;
            --error-color: #f43f5e;
        }
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-global);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .auth-header p {
            margin: 8px 0 0 0;
            color: var(--text-muted);
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #fafbfc;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: var(--bg-surface);
            box-shadow: 0 0 0 4px rgba(10, 102, 194, 0.1);
        }
        .error-message {
            color: var(--error-color);
            font-size: 13px;
            font-weight: 500;
            margin: 6px 0 0 0;
            display: flex;
            align-items: center;
        }
        .btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(10, 102, 194, 0.15);
        }
        .btn-submit:hover {
            background-color: var(--primary-hover);
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            body {
                background-color: var(--bg-surface);
                display: block;
            }
            .auth-card {
                border: none;
                box-shadow: none;
                padding: 30px 10px;
            }
            .auth-header {
                margin-top: 20px;
            }
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
        to { transform: rotate(360deg); }}
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">      
            <div class="auth-header">
                <h1>CodeIn</h1>
                <p>Join the community of elite developers</p>
            </div>
            <form action="" method="POST" novalidate id="myform">
                {% csrf_token %}
                {% for field in f %}
                <div class="form-group">
                    {{ field }}
                    {% if field.errors %}
                        {% for error in field.errors %}
                        <p class="error-message">⚠️ {{ error }}</p>
                        {% endfor %}
                    {% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn-submit" id="myid">Create Account</button>
            </form>
            <div class="auth-footer">
                Already have an account?<a href="{% url 'user_login' %}">Login</a>
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border-color, #e8edf3); text-align: center;">
                    <a href="{% url 'developer_story' %}" style="color: var(--primary, #0a66c2); text-decoration: none; font-weight: 600; font-size: 13.5px; display: inline-block;">
                        🚀 Meet the Creator & Project Story
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const myform=document.getElementById('myform')
        const mybutton=document.getElementById('myid')
        myform.addEventListener('submit',function(){
            mybutton.innerHTML='<span class="loading-spinner"></span>';
            mybutton.disabled=true;
        });
        window.addEventListener('pageshow',function(e){
            if(e.persisted){
                mybutton.inert='Create Account';
                mybutton.disabled=false;
            }
        });
    </script>

</body>
</html>
